schema_version: "1.0"
engine: controlled-local-service-robustness
endpoint:
  # 服务必须与测试进程位于同一个可重置沙箱；只接受 localhost/回环 IP。
  url: "http://127.0.0.1:11434/api/generate"
  method: POST
  timeout_seconds: 3
  max_response_bytes: 65536
sandbox:
  low_privilege: true
  external_network_disabled: true
  read_only_root: true
  disposable: true
  memory_limit_mb: 512
  cpu_limit: 1.0
  process_limit: 32
  case_limit: 32
  max_text_length: 8192
evidence:
  retain_raw_inputs: false
  retain_response_bodies: false
  allowed_observations:
    - crash
    - abnormal_exit
    - memory_error
    - timeout
    - service_unavailable
reset:
  required: true
  strategy: restore_clean_snapshot
