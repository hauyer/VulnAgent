[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnagent"
version = "0.3.0"
description = "Evidence-first multi-agent vulnerability analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "langgraph>=0.6,<2",
  "langchain-core>=0.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
binary-analysis = [
  "pefile>=2024.8.26",
  "pyelftools>=0.33",
  "capstone>=5.0,<6",
  "yara-python>=4.5,<5",
  "unicorn>=2.1,<3",
]
report-export = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
